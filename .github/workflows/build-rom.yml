name: build-rom

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ROM with SGDK
        run: docker run --rm -v "$PWD":/src -u "$(id -u):$(id -g)" ghcr.io/stephane-d/sgdk:latest

      - name: Collect ROM
        run: cp out/rom.bin syntaxis-fractal-genesis.bin

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: syntaxis-fractal-genesis
          path: syntaxis-fractal-genesis.bin
